# Local HydraDB node for development.
#
#   npm run hydra:up     start it and wait for it to answer
#   npm run hydra:probe  round-trip real queries, which is the only real proof
#   npm run hydra:logs   follow the node's output
#   npm run hydra:down   stop it
#
# Storage is a bind mount under .hydradb/, so the graph survives restarts.
# Plaintext and a fixed token are deliberate: this is a single-node development
# setup on localhost. A deployed node uses TLS and a secret token file.

services:
  hydradb:
    image: ghcr.io/hydra-db/hydradb:latest
    container_name: dropshipping-hydradb
    # The image runs as uid 10001 but the bind mount is owned by the host user,
    # so without this the node cannot write its store and dies on first write.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "7687:7687" # Bolt
      - "8443:8443" # HTTP query API
      - "9090:9090" # readiness + Prometheus metrics
    volumes:
      - ./.hydradb:/data
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token
      GRAPH_ALLOW_PLAINTEXT: "true"
      # graph-node's async query futures overflow the default thread stack; the
      # node answers /readyz and then aborts on the first query without this.
      RUST_MIN_STACK: "33554432"
    # No healthcheck: the image carries no shell, curl or wget to probe itself
    # with, so readiness is polled from the host in scripts/hydra-up.sh instead.
    restart: unless-stopped
